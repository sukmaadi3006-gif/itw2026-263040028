<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Box Model</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .kotak1 {
        width: 300px;
        height: 300px;
        background-color: lightblue;
        /* margin-top: 20px;
        margin-right: auto;
        margin-bottom: 40px;
        margin-left: auto; */
        /* margin: 50px; */ /* keempat sisi 50px */
        /* margin: 50px auto;*/ /* atas dan bawah 50px, kiri dan kanan auto */
        /* margin: 50px auto 100px; */
        /* atas 50px, kiri dan kanan auto, bawah 100px */
        margin: 10px 20px 30px 40px;
        /* atas 10px, kanan 20px, bawah 30px, kiri 40px */
        padding: 50px;

        border: 20px solid blue;
        outline: 5px dashed rgb(191, 56, 191);
      }

      .kotak2 {
        width: 300px;
        height: 300px;
        background-color: lightgreen;
        margin: 10px 20px 30px 40px;
        padding: 50px;

        border: 20px solid green;
        outline: 5px solid salmon;
      }
    </style>
  </head>
  <body>
    <div class="kotak1">1</div>
    <div class="kotak2">2</div>
  </body>
</html>
