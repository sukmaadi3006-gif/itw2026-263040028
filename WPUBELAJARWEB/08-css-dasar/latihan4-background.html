<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotes Pendidikan</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        color: rgb(51, 49, 49);
        text-align: center;
        background-color: rgb(2, 103, 123);
        background-image:
          linear-gradient(
            to bottom,
            rgb(15 23 42 / 80%) 50%,
            rgb(15 23 42 / 40%)
          ),
          url(https://fastly.picsum.photos/id/258/1000/1000.jpg?hmac=-6VQKs9MOK0penLLfLOFNrE0yvyQB5f171SbjY1LRXY);
        background-size: cover;
        background-attachment: fixed;
        min-height: 100vh;
      }

      h1 {
        font-size: 4em;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 10px;
        text-decoration: none;
        /* text-shadow: 10px 10px    5px rgb(216 203 203 / 10%); */
        background-image: linear-gradient(
          to right,
          rgb(0, 115, 255),
          rgb(155, 45, 155)
        );
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 10px rgba(120, 222, 245, 0.5));
      }

      .quote {
        font-size: 22px;
        line-height: 2.2;
        word-spacing: 5px;
        color: rgb(189, 189, 189);
        background-color: rgb(255 255 255 / 5%);
        max-width: 600px;
        margin: auto;
        padding: 40px;
        border-radius: 20px;
        border: 1px solid rgb(255 255 255 / 10%);
        box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
      }

      .credit {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgb(190, 190, 190);
        font-weight: normal;
      }
    </style>
  </head>
  <body>
    <h1>Ilmu, Cahaya Penuntun Hidup</h1>

    <p class="quote">
      “Pendidikan bukan hanya tentang mengejar nilai di atas kertas,<br />
      tetapi tentang membentuk pribadi yang berpikir jernih,<br />
      berhati baik,<br />
      dan berani mencari kebenaran.”
    </p>

    <p class="credit">- Sukma Adillaksana</p>
  </body>
</html>
