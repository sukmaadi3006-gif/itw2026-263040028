<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotes Pendidikan</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        color: rgb(51, 49, 49);
        text-align: center;
        background-color: rgb(2, 103, 123);
      }

      h1 {
        font-size: 48px;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 10px;
        text-decoration: underline;
        text-decoration-style: y;
        text-decoration-color: #343f5b;
        text-decoration-skip-ink: none;
        text-shadow: 10px 10px 5px rgb(216 203 203 / 10%);
        color: #3c3535;
      }

      .quote {
        font-size: 22px;
        line-height: 2.2;
        word-spacing: 5px;
      }

      .credit {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgb(190, 190, 190);
        font-weight: normal;
      }
    </style>
  </head>
  <body>
    <h1>Ilmu, Cahaya Penuntun Hidup</h1>

    <p class="quote">
      “Pendidikan bukan hanya tentang mengejar nilai di atas kertas,<br />
      tetapi tentang membentuk pribadi yang berpikir jernih,<br />
      berhati baik,<br />
      dan berani mencari kebenaran.”
    </p>

    <p class="credit">- Sukma Adillaksana</p>
  </body>
</html>
